aid: shellrecharge
url: https://raw.githubusercontent.com/api-evangelist/shellrecharge/refs/heads/main/apis.yml
name: ShellRecharge
kind: company
description: ShellRecharge (formerly NewMotion) is Shell's EV charging network and
  operator platform. Its EV-Platform / Shell Developer APIs let partners and charge
  point operators manage public charging - retrieving charging locations, starting,
  stopping, and tracking charge sessions, and exchanging locations, sessions, tariffs,
  tokens, and CDRs over the OCPI 2.2.1 standard. The APIs are partner-gated and
  secured with OAuth 2.0 client credentials.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- EV Charging
- Electric Vehicles
- Mobility
- Charge Points
- OCPI
- Energy
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: shellrecharge:shellrecharge-public-locations-api
  name: ShellRecharge EV Public Locations API
  tags:
  - Locations
  - Charge Points
  - Stations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.shell.com/api-catalog/ev-public-locations/quick-start-guide
  baseURL: https://api.shell.com
  properties:
  - url: https://developer.shell.com/api-catalog/ev-public-locations/quick-start-guide
    type: Documentation
  - url: https://developer.shell.com/api-catalog/ev-public-locations
    type: APIReference
  - url: openapi/shellrecharge-openapi.yml
    type: OpenAPI
  description: Returns the list of public Shell Recharge EV charging locations -
    including locations available through roaming partners - with EVSE status,
    connector types, electrical specifications, opening hours, and tariff
    metadata. Supports listing all locations, fetching a location by uid, nearby
    search by latitude/longitude, and bounded map markers by zoom level.
- aid: shellrecharge:shellrecharge-public-charge-sessions-api
  name: ShellRecharge EV Public Charge Sessions API
  tags:
  - Sessions
  - Charging
  - EVSE
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.shell.com/api-catalog/ev-public-charge-sessions/quick-start-guide
  baseURL: https://api.shell.com
  properties:
  - url: https://developer.shell.com/api-catalog/ev-public-charge-sessions/quick-start-guide
    type: Documentation
  - url: https://developer.shell.com/api-catalog/ev-public-charge-sessions
    type: APIReference
  - url: openapi/shellrecharge-openapi.yml
    type: OpenAPI
  description: Manages charging at public Shell Recharge locations. Partners can
    start a session on an EVSE using an EV charge card number and EVSE ID,
    retrieve a session's status by id, stop an active session, and list the
    active sessions for a user (by EMAId).
- aid: shellrecharge:shellrecharge-ocpi-api
  name: ShellRecharge OCPI API
  tags:
  - OCPI
  - Roaming
  - Operator
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.shell.com/api-catalog/ev-private-locations-api/quick-start-guide
  baseURL: https://api.shell.com
  properties:
  - url: https://developer.shell.com/api-catalog/ev-private-locations-api/quick-start-guide
    type: Documentation
  - url: https://developer.shell.com/api-catalog
    type: APIReference
  - url: openapi/shellrecharge-openapi.yml
    type: OpenAPI
  description: Open Charge Point Interface (OCPI 2.2.1) API for charge point
    operators, organized around REST and GraphQL. Exposes the Credentials &
    Registration, Locations, Sessions, Tariffs, Tokens, and CDR (Charge Detail
    Record) modules for modernizing and roaming EV charging infrastructure.
- aid: shellrecharge:shellrecharge-tariffs-api
  name: ShellRecharge Tariffs API
  tags:
  - Tariffs
  - Pricing
  - OCPI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.shell.com/api-catalog/ev-private-locations-api/quick-start-guide
  baseURL: https://api.shell.com
  properties:
  - url: https://developer.shell.com/api-catalog/ev-private-locations-api/quick-start-guide
    type: Documentation
  - url: openapi/shellrecharge-openapi.yml
    type: OpenAPI
  description: OCPI Tariffs module for retrieving and managing the pricing
    structures (energy, time, flat, and parking components) applied to charge
    points across the Shell Recharge network and roaming partners.
- aid: shellrecharge:shellrecharge-tokens-api
  name: ShellRecharge Tokens API
  tags:
  - Tokens
  - Cards
  - Authorization
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.shell.com/api-catalog/ev-private-locations-api/quick-start-guide
  baseURL: https://api.shell.com
  properties:
  - url: https://developer.shell.com/api-catalog/ev-private-locations-api/quick-start-guide
    type: Documentation
  - url: openapi/shellrecharge-openapi.yml
    type: OpenAPI
  description: OCPI Tokens module for managing the RFID charge cards and app
    tokens used to authorize charging, including real-time authorization of a
    token against an EVSE.
