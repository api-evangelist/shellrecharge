specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: ShellRecharge
providerId: shellrecharge
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- EV Charging
- Electric Vehicles
- Mobility
- Charge Points
- OCPI
- Energy
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of ShellRecharge EV-Platform API and charging spend. ShellRecharge
  does not publish public per-API-call pricing; access is partner-gated under a
  Shell commercial agreement, and the economic activity is the underlying EV
  charging - billed via per-kWh / per-session tariffs and OCPI roaming settlement
  rather than API metering. Cost meters below are indicative of how charging
  spend is allocated and are not reconciled against a published rate card.
notes: >-
  Pricing is sales-led / partner-gated and was not publicly documented at the
  time of cataloging. Reconcile billing model, currency, and any API usage fees
  with Shell directly.
sources:
- https://developer.shell.com/api-catalog
- https://shellrecharge.com
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Shell
serviceCategory: Mobility and EV Charging
billingModel:
  pricingCategory: Commercial Agreement
  billingFrequency: Monthly
  billingCurrency: EUR
  chargeCategories:
  - Usage
  - Purchase
meters:
- name: charging_energy
  description: Energy delivered to vehicles, billed per kWh under the applicable tariff.
  unit: kWh
  aggregation: sum
  dimensions:
  - account
  - location
  - tariff
- name: charging_sessions
  description: Completed charging sessions, summarized as OCPI Charge Detail Records (CDRs).
  unit: sessions
  aggregation: sum
  dimensions:
  - account
  - location
- name: roaming_settlement
  description: Cross-network roaming charges settled with partners via OCPI.
  unit: sessions
  aggregation: sum
  dimensions:
  - account
  - partner
principles:
- name: Visibility
  description: Pull OCPI CDRs and session data to inspect per-location and per-tariff charging spend.
- name: Allocation
  description: Tag sessions and tokens per driver / fleet / cost center via the Tokens module.
- name: Optimization
  description: Use tariff and location data to route charging to lower-cost sites and off-peak windows.
- name: Accountability
  description: Assign owners per fleet or partner agreement; review CDR-based spend monthly against budget.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
